name: Live AI News Engine Daemon
on:
  schedule:
    - cron: '30 */6 * * *'  # Backup only - offset+spaced further out so it rarely lands mid-run
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: news-engine-daemon
  cancel-in-progress: false
jobs:
  run-live-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Real fix for the collision problem: GitHub's concurrency queue was letting
      # a second (cron-triggered) run get queued behind the self-chained run, then
      # cancelling one of them when both tried to proceed. This checks BEFORE doing
      # any real work whether another instance is already active, and exits cleanly
      # instead of fighting it - so you never lose a run to a collision again.
      - name: Guard Against Duplicate Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTIVE=$(gh run list --workflow="${{ github.workflow }}" --status=in_progress --json databaseId --jq 'length')
          echo "Active in-progress runs (including this one): $ACTIVE"
          if [ "$ACTIVE" -gt "1" ]; then
            echo "::warning::Another instance is already running - exiting cleanly to avoid collision."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: env.SKIP != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browser
        if: env.SKIP != 'true'
        run: playwright install --with-deps chromium

      - name: Execute AI News Engine
        if: env.SKIP != 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_engine.py

      # if: always() -> runs even if the engine step above crashed or timed out,
      # so the daemon chain can't silently die for hours waiting on the backup cron.
      - name: Trigger Next Continuous Runner
        if: always() && env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next continuous runner..."
          gh workflow run "${{ github.workflow }}" || gh workflow run news_engine.yml || echo "::warning::Failed to dispatch next run - relying on backup cron"

      - name: Pull and Save State
        if: always() && env.SKIP != 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase || true
          if [ -f state.json ]; then
            git add state.json
            git commit -m "auto: update news state history [skip ci]" || echo "Nothing to commit"
            git push || echo "::warning::Push failed - state changes from this run may be lost"
          fi
